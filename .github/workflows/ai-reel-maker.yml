name: AI Reel Maker checks

on:
  push:
    paths:
      - "ai-reel-maker/**"
      - ".github/workflows/ai-reel-maker.yml"
  pull_request:
    paths:
      - "ai-reel-maker/**"
      - ".github/workflows/ai-reel-maker.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q ai-reel-maker
